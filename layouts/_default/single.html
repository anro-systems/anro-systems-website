{{ define "main" }}
<section class="hero" style="padding: 4rem 0;">
  <div>
    <h1>{{ .Title }}</h1>
  </div>
</section>

<article class="content">
  <div class="container text-center">
    {{ .Content }}
  </div>
</article>

{{ if eq .Title "Enquiries" }}
<section class="content" style="background: var(--bg-light); padding-top: 0;">
  <div class="container">
    <div class="form-container">
      <!-- Form will be centered by the container -->
    </div>
  </div>
</section>
{{ end }}
{{ end }}
